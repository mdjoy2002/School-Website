{% load static %}
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ভর্তি আবেদন বন্ধ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Kalpurush';
            src: url('{% static "fonts/Kalpurush-v0.258.ttf" %}') format('truetype');
        }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f3f6fb;
            font-family: 'Kalpurush', 'Segoe UI', sans-serif;
        }
        .notice {
            max-width: 650px;
            margin: 20px;
            padding: 36px;
            border-radius: 18px;
            background: white;
            text-align: center;
            box-shadow: 0 18px 40px rgba(0, 0, 0, .08);
        }
        .school-name { color: #103d75; font-size: 1.8rem; font-weight: 700; }
    </style>
</head>
<body>
    <main class="notice">
        <div class="school-name">
            {{ school_info.school_name_bangla|default:'খন্দকার নাসের উদ্দিন মাধ্যমিক বিদ্যালয়' }}
        </div>
        <p class="text-muted mt-4 mb-4">বর্তমানে অনলাইন ভর্তি আবেদন গ্রহণ বন্ধ আছে। ভর্তি আবেদন চালু হলে এই পেজ থেকে আবেদন করা যাবে।</p>
        <a href="{% url 'home' %}" class="btn btn-primary">হোম পেজে ফিরে যান</a>
    </main>
</body>
</html>
