{% extends 'myteacher/base.html' %}

{% block content %}
<div class="no-print mx-auto max-w-6xl px-4 py-4 text-center">
    <button onclick="window.print()" class="rounded-lg bg-indigo-700 px-5 py-3 font-bold text-white">Print Result Card</button>
    <a href="{% url 'myteacher:manual_asr' %}?action=result" class="ml-2 rounded-lg bg-slate-700 px-5 py-3 font-bold text-white">Back to Manual ASR</a>
    {% if saved_batch %}<a href="{% url 'myteacher:manual_asr_saved' %}" class="ml-2 rounded-lg bg-emerald-700 px-5 py-3 font-bold text-white">Saved Documents</a>{% endif %}
</div>
<div class="mx-auto max-w-6xl px-4 pb-8">
    {% for result_data in results %}
        <div class="manual-result-page">
            {% include 'myteacher/result_card_display.html' %}
        </div>
    {% endfor %}
</div>
<style>
    @media print {
        nav, .no-print { display: none !important; }
        body { background: #fff !important; }
        main > div { max-width: none !important; padding: 0 !important; }
        .manual-result-page { page-break-after: always; break-after: page; }
        .manual-result-page:last-child { page-break-after: auto; break-after: auto; }
    }
</style>
{% endblock %}
